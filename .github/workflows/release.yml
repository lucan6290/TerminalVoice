name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract changelog for this version
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content -Raw -Path "CHANGELOG.md" -Encoding UTF8
          # 匹配 ## [X.Y.Z] ... 到下一个 ## [ 或链接锚点区
          $pattern = "(?ms)^## \[$tag\].*?\r?\n(.*?)(?=\r?\n## \[|\r?\n\[Unreleased\]:|\z)"
          $m = [regex]::Match($content, $pattern)
          if ($m.Success) {
            $body = $m.Groups[1].Value.Trim()
          } else {
            $body = "> 本次发布未在 CHANGELOG.md 中找到对应条目，请查看提交记录。"
          }
          $header = "请下载下方对应的安装包进行安装/更新：`n- Windows: ``.msi`` 安装包（推荐）`n- Windows: ``.nsis.zip`` 便携版（可选）`n`n---`n`n"
          $full = $header + $body
          $outPath = Join-Path $env:GITHUB_WORKSPACE "release-body.md"
          [System.IO.File]::WriteAllText($outPath, $full, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Extracted changelog body length: $($body.Length)"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TerminalVoice ${{ github.ref_name }}"
          releaseBodyPath: "release-body.md"
          releaseDraft: true
          prerelease: false
          args: "--target x86_64-pc-windows-msvc"
