[package]
name = "terminalvoice"
version = "0.1.2"
description = "TerminalVoice desktop voice input tool"
authors = ["TerminalVoice Contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "terminalvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
cpal = "0.16.0"
rubato = "0.16.2"
enigo = "0.6.1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
arboard = "3.6"
hound = "3.5"
serde_json = "1"
base64 = "0.22"
zeroize = "1.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader"] }
zip = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
dirs-next = "2"

[dev-dependencies]
tempfile = "3"
